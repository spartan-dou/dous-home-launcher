name: Release

# Signed APK on every push to main, published as a GitHub Release (for Obtainium)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Signing key
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease
          mv app/build/outputs/apk/release/app-release.apk "DousHomeLauncher-${GITHUB_SHA::7}.apk"
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "build-${GITHUB_SHA::7}" DousHomeLauncher-*.apk --title "build ${GITHUB_SHA::7}" --notes "$(git log -1 --pretty=%s)"
