name: Release

# Signed APK on every push to main, once the checks pass, published as a GitHub Release (for Obtainium)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/check.yml

  build:
    needs: check
    runs-on: ubuntu-latest
    # Only this job handles the signing key and writes the release
    permissions:
      contents: write
    steps:
      # Pinned by commit: these run next to the signing key
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease
          mv app/build/outputs/apk/release/app-release.apk "DousHomeLauncher-${GITHUB_SHA::7}.apk"
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "build-${GITHUB_SHA::7}" DousHomeLauncher-*.apk --title "build ${GITHUB_SHA::7}" --notes "$(git log -1 --pretty=%s)"
