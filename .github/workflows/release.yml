name: Release

# Signed APK on every push to main, once the checks pass, published as a GitHub Release numbered v1.<run>
# (the app updates itself from the latest one, see Updater.kt; Obtainium works too)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/check.yml

  build:
    needs: check
    runs-on: ubuntu-latest
    # Only this job handles the signing key and writes the release
    permissions:
      contents: write
    steps:
      # Pinned by commit: these run next to the signing key
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease
          mv app/build/outputs/apk/release/app-release.apk "DousHomeLauncher-v1.${GITHUB_RUN_NUMBER}.apk"
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v1.${GITHUB_RUN_NUMBER}" DousHomeLauncher-*.apk --target "$GITHUB_SHA" --latest --title "v1.${GITHUB_RUN_NUMBER}" --notes "$(git log -1 --pretty=%s)"
